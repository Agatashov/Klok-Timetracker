<!--
  Klok — App Icon  (1024 × 1024 master)
  Export flat square, no corner rounding — macOS applies the squircle mask automatically.
  Safe zone: ~824×824 (100px margin each side at 1024px).
  Colors from Theme.swift: background #0B0D10→#141619, accent #33E28A, border white@12%.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#141619"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-hands" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Rim: 78% of 1024 = ~799px diameter → r=399.5, centered at (512,512) -->
  <circle cx="512" cy="512" r="399"
          fill="none" stroke="white" stroke-opacity="0.12" stroke-width="6"/>

  <!-- Minute hand: 12 o'clock (straight up), thick rounded bar -->
  <!-- Width 58px, tip 330px above center → y=512−330=182, tail 48px below → h=378, rx=29 -->
  <rect x="483" y="182" width="58" height="378" rx="29"
        fill="#33E28A" filter="url(#glow-hands)"/>

  <!-- Hour hand: 4 o'clock (120° CW), shorter + slightly dimmer -->
  <!-- Width 48px, tip 260px above center → y=512−260=252, tail 48px below → h=308, rx=24 -->
  <rect x="488" y="252" width="48" height="308" rx="24"
        fill="#33E28A" opacity="0.78"
        transform="rotate(120 512 512)" filter="url(#glow-hands)"/>

  <!-- Center glow halo (soft, behind dot) -->
  <circle cx="512" cy="512" r="82" fill="#33E28A" opacity="0.20" filter="url(#glow)"/>

  <!-- Center dot -->
  <circle cx="512" cy="512" r="42" fill="#33E28A" filter="url(#glow-hands)"/>
</svg>
